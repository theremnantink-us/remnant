server {
    listen 80;
    server_name YOUR_DOMAIN.RU www.YOUR_DOMAIN.RU;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN.RU www.YOUR_DOMAIN.RU;

    # SSL — выдаётся certbot автоматически
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.RU/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.RU/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/remnant;
    index index.html;

    # Чистые URL без .html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Статика — кэш на месяц
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2|glb)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API → Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Service Worker — без кэша
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store";
        expires    0;
    }

    # Скрыть файлы деплоя
    location ~* \.(env|gitignore|sh|sql)$ {
        deny all;
    }

    # Скрыть серверный код
    location /server/ {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
